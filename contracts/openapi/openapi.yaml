openapi: 3.0.0
info:
  title: Call Calendar API
  version: 0.0.0
tags:
  - name: EventTypes
  - name: Schedule
  - name: PublicBooking
  - name: Bookings
paths:
  /actuator/health:
    get:
      operationId: health
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/bookings:
    get:
      operationId: Bookings_list
      description: List all bookings of the owner ordered by start time.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
      tags:
        - Bookings
  /api/bookings/{id}/note:
    put:
      operationId: Bookings_setNote
      description: |-
        Set the owner note of a booking, upcoming or past. Returns the updated booking.
        400 if the note is longer than 1000 characters after trimming; the saved note is then unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: 'Bad request: validation failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingNoteInput'
  /api/event-types:
    get:
      operationId: EventTypes_list
      description: List all event types of the owner.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - EventTypes
    post:
      operationId: EventTypes_create
      description: Create a new event type.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: 'Bad request: validation failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with existing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - EventTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeInput'
  /api/event-types/{id}:
    get:
      operationId: EventTypes_get
      description: Get an event type by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - EventTypes
    put:
      operationId: EventTypes_update
      description: Update an existing event type.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: 'Bad request: validation failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with existing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - EventTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeInput'
    delete:
      operationId: EventTypes_delete
      description: Delete an event type. Allowed only when no bookings reference it; otherwise 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with existing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - EventTypes
  /api/public/event-types/{slug}:
    get:
      operationId: PublicBooking_getEventType
      description: Get public information about an event type.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - PublicBooking
  /api/public/event-types/{slug}/bookings:
    post:
      operationId: PublicBooking_createBooking
      description: |-
        Book a slot. Availability is re-checked on the server;
        409 is returned if the slot is taken, in the past or outside the schedule.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestBooking'
        '400':
          description: 'Bad request: validation failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict with existing data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - PublicBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
  /api/public/event-types/{slug}/slots:
    get:
      operationId: PublicBooking_listSlots
      description: |-
        List all free slots of the event type within the booking window:
        today and the next 13 calendar days in the owner time zone.
        Slots that already started and slots overlapping existing bookings are excluded.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - PublicBooking
  /api/schedule:
    get:
      operationId: Schedules_get
      description: Get the owner's weekly schedule. Returns a default Mon-Fri 09:00-17:00 schedule if none was saved.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
      tags:
        - Schedule
    put:
      operationId: Schedules_update
      description: Replace the owner's weekly schedule. Existing bookings are not affected.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          description: 'Bad request: validation failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - eventTypeTitle
        - guestName
        - guestEmail
        - startAt
        - endAt
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        eventTypeId:
          type: integer
          format: int64
        eventTypeTitle:
          type: string
        guestName:
          type: string
        guestEmail:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 1000
          description: Owner note to the booking. Never shown to guests. Null or absent when the booking has no note.
      description: A confirmed meeting booked by a visitor, as shown in the owner area.
    BookingNoteInput:
      type: object
      required:
        - note
      properties:
        note:
          type: string
          description: |-
            Note text. Leading and trailing whitespace is trimmed;
            at most 1000 characters after trimming. An empty or blank value means the booking has no note.
      description: Owner note to set on a booking.
    BookingRequest:
      type: object
      required:
        - startAt
        - guestName
        - guestEmail
      properties:
        startAt:
          type: string
          format: date-time
          description: Start of the selected slot. Must be one of the slots returned by the slots endpoint.
        guestName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[\s\S]*\S[\s\S]*$
          description: Must contain at least one non-whitespace character.
        guestEmail:
          type: string
          minLength: 3
          maxLength: 320
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      description: Data entered by a visitor to book a time slot.
    BookingStatus:
      type: string
      enum:
        - CONFIRMED
    DayOfWeek:
      type: string
      enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      description: Error details returned for failed requests.
    EventType:
      type: object
      required:
        - id
        - slug
        - title
        - durationMinutes
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Unique URL-friendly identifier used in the public booking link.
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[\s\S]*\S[\s\S]*$
          description: Must contain at least one non-whitespace character.
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 720
          description: Meeting duration in minutes.
      description: A type of meeting that guests can book.
    EventTypeInput:
      type: object
      required:
        - slug
        - title
        - durationMinutes
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Unique URL-friendly identifier used in the public booking link.
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^[\s\S]*\S[\s\S]*$
          description: Must contain at least one non-whitespace character.
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          format: int32
          minimum: 5
          maximum: 720
          description: Meeting duration in minutes.
      description: Event type data sent by the owner when creating or updating an event type.
    GuestBooking:
      type: object
      required:
        - id
        - eventTypeId
        - eventTypeTitle
        - guestName
        - guestEmail
        - startAt
        - endAt
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        eventTypeId:
          type: integer
          format: int64
        eventTypeTitle:
          type: string
        guestName:
          type: string
        guestEmail:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          format: date-time
      description: |-
        A confirmed meeting as returned to the guest who booked it.
        Kept separate from the owner model so that owner-only booking data never reaches guests.
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
    Schedule:
      type: object
      required:
        - timeZone
        - intervals
      properties:
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA time zone identifier of the schedule, e.g. Europe/Moscow or UTC. Fixed offsets such as +03:00 are rejected.
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyInterval'
          maxItems: 100
          description: Available intervals. Intervals of the same day must not overlap. Empty list means no availability.
      description: Weekly availability of the owner.
    TimeOfDay:
      type: string
      pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      description: Local time of day in 24-hour HH:mm format.
    TimeSlot:
      type: object
      required:
        - startAt
        - endAt
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
      description: A free time slot that can be booked.
    WeeklyInterval:
      type: object
      required:
        - dayOfWeek
        - startTime
        - endTime
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        startTime:
          allOf:
            - $ref: '#/components/schemas/TimeOfDay'
          description: Start time (inclusive) in the schedule time zone.
        endTime:
          allOf:
            - $ref: '#/components/schemas/TimeOfDay'
          description: End time (exclusive) in the schedule time zone. Must be after startTime.
      description: A recurring weekly time range when the owner is available.
servers:
  - url: http://localhost:8080
    description: Local development server
    variables: {}
