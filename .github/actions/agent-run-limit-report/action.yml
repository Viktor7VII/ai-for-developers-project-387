name: Agent run limit report
description: >-
  Reports on the pull request that an agent run was refused by the run limit. Keeps one comment of
  github-actions[bot] up to date; the comment is only a report, the budget itself is never read from it.

inputs:
  pr-number:
    description: Pull request number.
    required: true
  kind:
    description: What was refused, for example "авторевью" or "/oc".
    required: true
  max-runs:
    description: Maximum agent runs per pull request.
    required: false
    default: "3"
  token:
    description: Token with pull-requests:write (GITHUB_TOKEN).
    required: true

runs:
  using: composite
  steps:
    - name: Report refused agent run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        KIND: ${{ inputs.kind }}
        MAX_RUNS: ${{ inputs.max-runs }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        marker='<!-- opencode-run-limit -->'
        body="$marker
        **Лимит запусков агента исчерпан: $MAX_RUNS из $MAX_RUNS.**

        Последний отклонённый запуск «$KIND» остановлен до вызова модели: $RUN_URL
        Авторевью и команды \`/oc\` в этом PR больше не выполняются. Лимит считается по истории запусков GitHub Actions и не сбрасывается."
        comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | sed -n 1p)"
        if [ -n "$comment_id" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
        else
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
        fi
