name: Agent run limit
description: >-
  Allows at most max-runs OpenCode agent runs per pull request, checked inside the job that calls the
  model, before the model is called. The budget is read from the GitHub Actions job history of both agent
  workflows, which the agent can't change (its App has only actions:read): every earlier agent job whose
  "Reserve agent run" step succeeded, or which may still reach it, takes one run. Jobs are ordered by id:
  a job counts every earlier job, so concurrent jobs agree as long as the API lists every earlier job.
  The Actions API is not read-after-write consistent, so runs are listed without search-backed filters and
  the budget is checked again after settle-seconds, still before the model is called. Re-runs create new
  jobs and are counted again; jobs cancelled or timed out after the reservation stay counted. A refused
  job fails.

inputs:
  pr-number:
    description: Pull request number.
    required: true
  job-name:
    description: Name of the calling job, used to find its own job id.
    required: true
  max-runs:
    description: Maximum agent runs per pull request.
    required: false
    default: "3"
  wait-for-earlier:
    description: "'true' to wait until earlier /oc jobs of the pull request finish (FIFO, no lost commands)."
    required: false
    default: "false"
  settle-seconds:
    description: Pause before the second budget check, so earlier concurrent jobs become visible in the API.
    required: false
    default: "20"
  token:
    description: Token with actions:read and pull-requests:read (GITHUB_TOKEN).
    required: true

outputs:
  allowed:
    description: "'true' when the run may call the model."
    value: ${{ steps.limit.outputs.allowed }}
  used:
    description: Agent runs of the pull request taken before this one.
    value: ${{ steps.limit.outputs.used }}

runs:
  using: composite
  steps:
    - name: Check agent run budget
      id: limit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        JOB_NAME: ${{ inputs.job-name }}
        MAX_RUNS: ${{ inputs.max-runs }}
        WAIT: ${{ inputs.wait-for-earlier }}
        SETTLE: ${{ inputs.settle-seconds }}
      run: |
        set -euo pipefail
        repo="$GITHUB_REPOSITORY"

        my_id="$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
          --jq ".jobs[] | select(.name == \"$JOB_NAME\" and .status == \"in_progress\") | .id" | sed -n 1p)"
        [ -n "$my_id" ] || { echo "::error::Cannot find the current job '$JOB_NAME'."; exit 1; }
        created="$(gh api "repos/$repo/pulls/$PR_NUMBER" --jq '.created_at')"

        # Every API call must succeed: an incomplete history would undercount the budget,
        # so the helpers below fail on the first error instead of returning partial output.

        # Runs of the agent workflows for this pull request; run-name is "<workflow> · #<PR number>".
        # No `created`/`status` filters: GitHub serves those from a search index that can lag behind new
        # runs. Pages come newest first and stop at runs older than the pull request.
        pr_runs() {
          local workflow page lines
          for workflow in "$@"; do
            page=1
            while :; do
              lines="$(gh api "repos/$repo/actions/workflows/$workflow/runs?per_page=100&page=$page" \
                --jq ".workflow_runs[] | [(.id | tostring), .created_at,
                      (if (.display_title | endswith(\" · #$PR_NUMBER\")) then \"1\" else \"0\" end)] | join(\" \")")" \
                || return 1
              [ -n "$lines" ] || break
              printf '%s\n' "$lines" | awk '$3 == "1" { print $1 }'
              [ "$(printf '%s\n' "$lines" | wc -l)" -lt 100 ] && break
              [[ "$(printf '%s\n' "$lines" | tail -n 1 | cut -d' ' -f2)" < "$created" ]] && break
              page=$((page + 1))
            done
          done
        }

        # Prints the jq results for the jobs (all run attempts) of every given run, failing on any error.
        runs_jobs() {
          local jq_filter="$1" runs run_id
          shift
          runs="$(pr_runs "$@")" || return 1
          for run_id in $runs; do
            gh api --paginate "repos/$repo/actions/runs/$run_id/jobs?filter=all&per_page=100" --jq "$jq_filter" || return 1
          done
        }

        # Earlier agent jobs that took a run or still may take one. Per job: "<job id>|<job name>|<state>";
        # taken = reserved a run, pending = not finished and may still reserve one (fail-closed for
        # concurrent jobs), free = never reserved. filter=all returns jobs of every run attempt
        # (Re-run all / failed jobs); a job listed twice is counted once.
        count_used() {
          local states
          states="$(runs_jobs "
            .jobs[] | select((.name == \"Run OpenCode\" or .name == \"Review pull request\") and .id < $my_id)
            | ([.steps[]? | select(.name == \"Reserve agent run\")][0]) as \$reserve
            | \"\(.id)|\" + .name + \"|\" + (if \$reserve.conclusion == \"success\" then \"taken\"
                elif .status != \"completed\" and (\$reserve == null or \$reserve.status != \"completed\") then \"pending\"
                else \"free\" end)" opencode.yml opencode-review.yml)" || return 1
          printf '%s\n' "$states" | sort -u | grep -cE '\|(taken|pending)$' || true
        }
        refuse() {
          echo "used=$1" >> "$GITHUB_OUTPUT"
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          echo "::error::Agent run limit reached for PR #$PR_NUMBER ($1 of $MAX_RUNS); the model is not called."
          echo "Лимит запусков агента исчерпан ($1 из $MAX_RUNS) — модель не вызывалась." >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }
        unreadable() {
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          echo "::error::Cannot read the agent run history; the run is refused."
          exit 1
        }

        used="$(count_used)" || unreadable
        [ "$used" -lt "$MAX_RUNS" ] || refuse "$used"
        # Second check after a pause: an earlier concurrent job created moments before this one may not
        # be listed yet. Both checks happen before the model is called and before the reservation.
        sleep "${SETTLE:-20}"
        recheck="$(count_used)" || unreadable
        [ "$recheck" -gt "$used" ] && used="$recheck"
        [ "$used" -lt "$MAX_RUNS" ] || refuse "$used"
        echo "used=$used" >> "$GITHUB_OUTPUT"
        echo "allowed=true" >> "$GITHUB_OUTPUT"
        echo "Запуск агента $((used + 1)) из $MAX_RUNS." >> "$GITHUB_STEP_SUMMARY"

        # /oc commands of one pull request run one after another in the order received. Cancelled, failed
        # and timed out jobs are "completed" and release the queue; the job timeout bounds the wait.
        # An API error is retried instead of being taken as "nobody is running".
        if [ "$WAIT" = true ]; then
          while :; do
            if earlier="$(runs_jobs ".jobs[] | select(.name == \"Run OpenCode\" and .id < $my_id and .status != \"completed\") | .id" opencode.yml)"; then
              busy="$(printf '%s\n' "$earlier" | sort -u | grep -c . || true)"
              [ "$busy" -eq 0 ] && break
              echo "Waiting for $busy earlier /oc run(s) of PR #$PR_NUMBER..."
            else
              echo "::warning::Cannot read earlier /oc runs; retrying."
            fi
            sleep 20
          done
        fi
