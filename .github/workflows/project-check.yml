name: project-check

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Run project checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install project tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: |
          npm ci --prefix contracts
          npm ci --prefix frontend

      - name: Run all checks
        run: mise run check

  e2e:
    name: Run browser scenario
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install project tools
        uses: jdx/mise-action@v4

      # Maven dependencies of the backend the browser scenario starts: on a fresh runner they were all
      # downloaded from Maven Central on every run, and Central answers HTTP 429 (Too Many Requests) at times.
      # Java and Maven come from mise above; only the local repository is cached (saved after a passing run).
      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-e2e-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-e2e-${{ runner.os }}-

      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Install Chromium for Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run browser scenario
        run: mise run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
